			shellScript = "# GENERATE_INFOPLIST_FILE only synthesizes Apple's own known Info.plist\n# keys from INFOPLIST_KEY_* build settings; third-party keys like AdMob's\n# GADApplicationIdentifier are silently dropped. Inject it directly here\n# instead, iOS only (no ads/AdMob on macOS).\nif [ \"$PLATFORM_NAME\" = \"iphoneos\" ] || [ \"$PLATFORM_NAME\" = \"iphonesimulator\" ]; then\n  PLIST=\"$CODESIGNING_FOLDER_PATH/Info.plist\"\n  if [ -f \"$PLIST\" ] && [ -n \"$GAD_APPLICATION_IDENTIFIER\" ]; then\n    /usr/libexec/PlistBuddy -c \"Delete :GADApplicationIdentifier\" \"$PLIST\" 2>/dev/null\n    /usr/libexec/PlistBuddy -c \"Add :GADApplicationIdentifier string $GAD_APPLICATION_IDENTIFIER\" \"$PLIST\"\n  fi\n  # SKAdNetworkItems: Google's required ad-network identifiers for\n  # SKAdNetwork attribution (fetched from developers.google.com/admob/ios/ios14).\n  if [ -f \"$PLIST\" ]; then\n    /usr/libexec/PlistBuddy -c \"Delete :SKAdNetworkItems\" \"$PLIST\" 2>/dev/null\n    /usr/libexec/PlistBuddy -c \"Add :SKAdNetworkItems array\" \"$PLIST\" 2>/dev/null\n    NETWORKS=(cstr6suwn9.skadnetwork 4fzdc2evr5.skadnetwork 2fnua5tdw4.skadnetwork ydx93a7ass.skadnetwork p78axxw29g.skadnetwork v72qych5uu.skadnetwork ludvb6z3bs.skadnetwork cp8zw746q7.skadnetwork 3sh42y64q3.skadnetwork c6k4g5qg8m.skadnetwork s39g8k73mm.skadnetwork wg4vff78zm.skadnetwork 3qy4746246.skadnetwork f38h382jlk.skadnetwork hs6bdukanm.skadnetwork mlmmfzh3r3.skadnetwork v4nxqhlyqp.skadnetwork wzmmz9fp6w.skadnetwork su67r6k2v3.skadnetwork yclnxrl5pm.skadnetwork t38b2kh725.skadnetwork 7ug5zh24hu.skadnetwork gta9lk7p23.skadnetwork vutu7akeur.skadnetwork y5ghdn5j9k.skadnetwork v9wttpbfk9.skadnetwork n38lu8286q.skadnetwork 47vhws6wlr.skadnetwork kbd757ywx3.skadnetwork 9t245vhmpl.skadnetwork a2p9lx4jpn.skadnetwork 22mmun2rn5.skadnetwork 44jx6755aq.skadnetwork k674qkevps.skadnetwork 4468km3ulz.skadnetwork 2u9pt9hc89.skadnetwork 8s468mfl3y.skadnetwork klf5c3l5u5.skadnetwork ppxm28t8ap.skadnetwork kbmxgpxpgc.skadnetwork u